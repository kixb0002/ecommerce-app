# Rôle : CI : tests/audit, build, test du runtime, scan bloquant, ACR puis PR GitOps optionnelle ; aucun accès AKS.
name: Test, scan, build and propose GitOps
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Aucune identité Azure nécessaire pour valider une PR, y compris depuis un fork.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - run: python -m unittest discover -s tests -v
      - run: pip-audit -r requirements.txt
  # OIDC est accordé à ce job uniquement ; la fédération Azure accepte main, pas les PR.
  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_AZURE_BUILD == 'true'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name tmgitops237d8c7f
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build locally before scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          push: false
          tags: tmgitops237d8c7f.azurecr.io/ecommerce-api:${{ github.sha }}
      - name: Test the built runtime image
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/tests:/app/tests:ro" --entrypoint python \
            "tmgitops237d8c7f.azurecr.io/ecommerce-api:$GITHUB_SHA" \
            -m unittest discover -s tests -v
      # Le push dépend du succès du scan : aucune exception HIGH/CRITICAL, même sans correctif.
      - name: Scan OS and language dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          image-ref: tmgitops237d8c7f.azurecr.io/ecommerce-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Push the scanned image and resolve immutable digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker push "tmgitops237d8c7f.azurecr.io/ecommerce-api:$GITHUB_SHA"
          digest=$(az acr repository show --name tmgitops237d8c7f --image "ecommerce-api:$GITHUB_SHA" --query digest -o tsv)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
  # Une GitHub App séparée doit proposer une PR ; elle ne déploie jamais directement sur AKS.
  promote:
    if: vars.ENABLE_GITOPS_PR == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: GitOps repository token
        id: gitops-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: kixb0002
          repositories: platform-gitops
      - name: Checkout GitOps repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: kixb0002/platform-gitops
          ref: main
          path: gitops
          token: ${{ steps.gitops-token.outputs.token }}
          persist-credentials: false
      - name: Open a promotion PR for Dev
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
          python3 - <<'PY'
          import os,pathlib,re,yaml
          digest=os.environ['IMAGE_DIGEST']
          assert re.fullmatch(r'sha256:[a-f0-9]{64}',digest)
          path=pathlib.Path('apps/ecommerce/overlays/dev/kustomization.yaml')
          doc=yaml.safe_load(path.read_text())
          doc['images'][0]['digest']=digest
          path.write_text(yaml.safe_dump(doc,sort_keys=False))
          PY
          branch="ci/ecommerce-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/ecommerce/overlays/dev/kustomization.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(dev): promote ecommerce image $GITHUB_SHA"
          gh auth setup-git
          git push --set-upstream origin "$branch"
          printf 'Promote the tested and scanned image `%s`. Source commit: `%s`.\n' "$IMAGE_DIGEST" "$GITHUB_SHA" > /tmp/promotion.md
          gh pr create --repo kixb0002/platform-gitops --base main --head "$branch" --title 'Promote ecommerce image to Dev' --body-file /tmp/promotion.md
